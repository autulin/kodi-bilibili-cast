name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile
        run: python3 -m compileall -q service.bili.cast tools
      - name: Build addon zip
        run: |
          chmod +x tools/build_zip.sh
          ./tools/build_zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: service.bili.cast
          path: dist/*.zip
